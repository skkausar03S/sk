<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docify Enterprise Portal | Voter Search</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-left: #0b1120;
      --bg-right: #111827;
      --card-bg: #1e293b;
      --input-bg: #111827;
      --input-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-left);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Left Branding Panel */
    .left-panel {
      flex: 1;
      background: radial-gradient(circle at top left, #13223f 0%, #0b1120 70%);
      padding: 60px 8%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid #1e293b;
    }

    .brand-logo {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 18px;
      display: inline-block;
    }

    .hero-title {
      font-size: 32px;
      font-weight: 700;
      color: #38bdf8;
      line-height: 1.25;
      margin-bottom: 16px;
      max-width: 440px;
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: 14.5px;
      line-height: 1.6;
      max-width: 440px;
      margin-bottom: 42px;
    }

    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 460px;
    }

    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .feature-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .feature-text h4 {
      font-size: 15.5px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    .feature-text p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Right Auth Panel */
    .right-panel {
      flex: 1;
      background-color: var(--bg-right);
      padding: 40px 8%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .auth-box {
      width: 100%;
      max-width: 430px;
    }

    .auth-header h2 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .auth-header p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #64748b;
      display: flex;
      align-items: center;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px 12px 40px;
      background-color: #1e2636;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: #38bdf8;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      font-size: 13px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
      cursor: pointer;
    }

    .link-btn {
      background: none;
      border: none;
      color: #38bdf8;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
    }

    .link-btn:hover {
      text-decoration: underline;
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #2563eb 0%, #6366f1 100%);
      color: white;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.92;
    }

    .btn-create {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #10b981 0%, #2563eb 100%);
      color: white;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .btn-create:hover {
      opacity: 0.92;
    }

    .alert-box {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
    }
    .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; }
    .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #6ee7b7; }
    .hidden { display: none !important; }

    /* DASHBOARD LAYOUT */
    .dashboard-layout {
      display: flex;
      min-height: 100vh;
      background-color: #0b1120;
      width: 100%;
    }

    .sidebar {
      width: 260px;
      background-color: #0b1120;
      border-right: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 20px;
      font-size: 13px;
      color: #64748b;
      border-bottom: 1px solid #1e293b;
    }

    .sidebar-menu {
      list-style: none;
      padding: 15px 10px;
      overflow-y: auto;
      max-height: calc(100vh - 70px);
    }

    .sidebar-menu li {
      margin-bottom: 4px;
    }

    .sidebar-menu a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 13.5px;
      border-radius: 6px;
      transition: 0.2s;
    }

    .sidebar-menu a:hover, .sidebar-menu a.active {
      background-color: #1e293b;
      color: #38bdf8;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #0b1120;
    }

    .topbar {
      height: 70px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      background-color: #0b1120;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .balance-badge {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid #10b981;
      color: #34d399;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .user-profile {
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13.5px;
      color: #cbd5e1;
    }

    .content-body {
      padding: 30px;
      overflow-y: auto;
      flex: 1;
    }

    .breadcrumb {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* VOTER SEARCH BOX */
    .search-card {
      background-color: #111827;
      border: 1px solid #1e293b;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .search-card-header {
      background: #2563eb;
      color: white;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
    }

    .search-grid {
      padding: 24px;
      display:
